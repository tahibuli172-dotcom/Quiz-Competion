<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলাদেশ ও বিশ্ব কুইজ</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .quiz-container {
            background-color: #fff;
            width: 100%;
            max-width: 700px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #007bff;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .stat-box {
            display: flex;
            gap: 15px;
        }
        .stat-right { color: #28a745; background: #fff; padding: 4px 8px; border-radius: 4px; }
        .stat-wrong { color: #dc3545; background: #fff; padding: 4px 8px; border-radius: 4px; }
        .timer-box { background: #ffc107; color: #000; padding: 4px 10px; border-radius: 4px; }
        
        .question-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: 0.2s;
        }
        .option-btn:hover {
            background-color: #e2e6ea;
        }
        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
        }
        .option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }
        .nav-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            float: right;
            display: none;
        }
        .result-screen {
            text-align: center;
            display: none;
        }
        .result-screen h2 {
            color: #28a745;
            font-size: 24px;
        }
        .result-details {
            font-size: 18px;
            margin: 20px 0;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-header" class="header-stats">
        <div class="stat-box">
            <span>Right: <span id="right-count" class="stat-right">0</span></span>
            <span>Wrong: <span id="wrong-count" class="stat-wrong">0</span></span>
        </div>
        <div class="timer-box">
            সময়: <span id="time-display">08:00</span>
        </div>
    </div>

    <div id="quiz-body">
        <div id="question-text" class="question-title">প্রশ্ন লোড হচ্ছে...</div>
        <div id="options" class="options-container"></div>
        <button id="next-btn" class="nav-btn" onclick="nextQuestion()">পরবর্তী প্রশ্ন</button>
        <div style="clear:both;"></div>
    </div>

    <div id="result-body" class="result-screen">
        <h2>Congratulations!</h2>
        <p>আপনি সফলভাবে কুইজটি সম্পন্ন করতে পেরেছেন।</p>
        <div class="result-details">
            <p>মোট উত্তর দেওয়া হয়েছে: <span id="total-answered">0</span>/30</p>
            <p style="color: #28a745; font-weight: bold;">সঠিক উত্তর: <span id="final-right">0</span> টি</p>
            <p style="color: #dc3545; font-weight: bold;">ভুল উত্তর: <span id="final-wrong">0</span> টি</p>
        </div>
    </div>
</div>

<script>
const quizData = [
    { q: "১. ১৯৭১ সালের ১৬ ডিসেম্বর পাকিস্তানি বাহিনী কোথায় আত্মসমর্পণ করে?", a: ["রেসকোর্স ময়দান", "পল্টন ময়দান", "ঢাকা চত্বর", "কার্জন হল"], correct: 0 },
    { q: "২. বাংলাদেশের সাংবিধানিক নাম কী?", a: ["গণপ্রজাতন্ত্রী বাংলাদেশ", "বাংলাদেশ প্রজাতন্ত্র", "বাংলাদেশ ইসলামিক প্রজাতন্ত্র", "স্বাধীন বাংলাদেশ"], correct: 0 },
    { q: "৩. প্রাচীন বাংলায় 'গৌড়' রাজ্যের রাজধানী কোথায় ছিল?", a: ["কর্ণসুবর্ণ", "পুণ্ড্রনগর", "মহাস্থানগড়", "বিক্রমপুর"], correct: 0 },
    { q: "৪. প্রথম বিশ্বযুদ্ধ শুরু হয় কোন সালে?", a: ["১৯১৪", "১৯১৬", "১৯১৮", "১৯৩৯"], correct: 0 },
    { q: "৫. ভূমধ্যসাগর ও লোহিত সাগরকে যুক্ত করেছে কোন খাল?", a: ["সুয়েজ খাল", "পানামা খাল", "কিল খাল", "গ্র্যান্ড খাল"], correct: 0 },
    { q: "৬. 'অপারেশন সার্চলাইট' কত তারিখে পরিচালিত হয়?", a: ["২৫ মার্চ ১৯৭১", "২৬ মার্চ ১৯৭১", "৭ মার্চ ১৯৭১", "১৬ ডিসেম্বর ১৯৭১"], correct: 0 },
    { q: "৭. নোবেল পুরস্কার প্রবর্তন করা হয় কত সালে?", a: ["১৯০১", "১৯০০", "১৯০৫", "১৮৯৫"], correct: 0 },
    { q: "৮. বিশ্বের গভীরতম রদ কোনটি?", a: ["বৈকাল হ্রদ", "কাস্পিয়ান সাগর", "ভিক্টোরিয়া হ্রদ", "সুপিরিয়র"], correct: 0 },
    { q: "৯. মুজিবনগর সরকার আনুষ্ঠানিকভাবে কবে শপথ গ্রহণ করে?", a: ["১৭ এপ্রিল ১৯৭১", "১০ এপ্রিল ১৯৭১", "২৬ মার্চ ১৯৭১", "১৬ ডিসেম্বর ১৯৭১"], correct: 0 },
    { q: "১০. নদী ছাড়া 'মহানন্দা' কিসের নাম?", a: ["আম", "ধান", "গম", "পাট"], correct: 0 },
    { q: "১১. জাতিসংঘ কত সালে প্রতিষ্ঠিত হয়?", a: ["১৯৪৫", "১৯৪৪", "১৯৪৬", "১৯৫০"], correct: 0 },
    { q: "১২. কিয়োটো প্রটোকল কিসের সাথে সম্পর্কিত?", a: ["পরিবেশ সুরক্ষা", "আন্তর্জাতিক বাণিজ্য", "আণবিক অস্ত্র প্রতিরোধ", "মানবাধিকার"], correct: 0 },
    { q: "১৩. 'ব্ল্যাক ক্যাট' কোন দেশের কমান্ডো বাহিনী?", a: ["ভারত", "পাকিস্তান", "যুক্তরাজ্য", "আমেরিকা"], correct: 0 },
    { q: "১৪. বাংলাদেশের একমাত্র প্রবাল দ্বীপ কোনটি?", a: ["সেন্টমার্টিন", "মহেশখালী", "হাতিয়া", "সন্দ্বীপ"], correct: 0 },
    { q: "১৫. রেনেসাঁ কোন দেশ থেকে শুরু হয়?", a: ["ইতালি", "ফ্রান্স", "ইংল্যান্ড", "জার্মানি"], correct: 0 },
    { q: "১৬. 'আন্তর্জাতিক বিচার আদালত' (ICJ)-এর সদর দপ্তর কোথায়?", a: ["হেগ", "জেনেভা", "নিউ ইয়র্ক", "প্যারিস"], correct: 0 },
    { q: "১৭. সূর্য সেনের নেতৃত্বে চট্টগ্রাম অস্ত্রাগার লুণ্ঠন হয় কত সালে?", a: ["১৯৩০", "১৯২৯", "১৯৩১", "১৯৩২"], correct: 0 },
    { q: "১৮. পৃথিবীর বৃহত্তম বদ্বীপ কোনটি?", a: ["বাংলাদেশ", "সবুজ দ্বীপ", "মাদাগাস্কার", "সুমাত্রা"], correct: 0 },
    { q: "১৯. ইতিহাস বিখ্যাত 'ট্রয়' নগরী কোথায় অবস্থিত?", a: ["তুরস্ক", "গ্রিস", "ইতালি", "মিশর"], correct: 0 },
    { q: "২০. লালবাগ কেল্লার নির্মাণকাজ কে শুরু করেছিলেন?", a: ["যুবরাজ মোহাম্মদ আজম", "শায়েস্তা খাঁ", "ইসলাম খাঁ", "মির জুমলা"], correct: 0 },
    { q: "২১. বিশ্ব স্বাস্থ্য সংস্থা (WHO)-এর সদর দপ্তর কোথায়?", a: ["জেনেভা", "ভিয়েনা", "লন্ডন", "প্যারিস"], correct: 0 },
    { q: "২২. বাংলাদেশের সংবিধান কার্যকর হয় কত তারিখে?", a: ["১৬ ডিসেম্বর ১৯৭২", "৪ নভেম্বর ১৯৭২", "২৬ মার্চ ১৯৭২", "১৬ ডিসেম্বর ১৯৭১"], correct: 0 },
    { q: "২৩. মেসোপটেমীয় সভ্যতা প্রধানত গড়ে উঠেছিল কোন নদীর তীরে?", a: ["টাইগ্রিস ও ইউফ্রেটিস", "নীল নদ", "সিন্ধু নদ", "আমাজন"], correct: 0 },
    { q: "২৪. ম্যাগনা কার্টা (Magna Carta) চুক্তি কত সালে স্বাক্ষরিত হয়?", a: ["১২১৫", "১২২০", "১৩০৫", "১১৪৫"], correct: 0 },
    { q: "২৫. 'ইউরো' মুদ্রা চালু হয় কত সালে?", a: ["১৯৯৯", "২০০০", "১৯৯৫", "২০০২"], correct: 0 },
    { q: "২৬. বাংলাদেশের জাতীয় সংসদের স্থপতি কে?", a: ["লুই আই কান", "মাজহারুল ইসলাম", "ফজলুর রহমান খান", "হামিদুর রহমান"], correct: 0 },
    { q: "২৭. বিশ্বের দীর্ঘতম পর্বতমালা কোনটি?", a: ["আন্দিজ", "হিমালয়", "আল্পস", "রকি"], correct: 0 },
    { q: "২৮. গ্রিনিচ মান সময় (GMT) কোন দেশে অবস্থিত?", a: ["যুক্তরাজ্য", "আমেরিকা", "ফ্রান্স", "সুইজারল্যান্ড"], correct: 0 },
    { q: "২৯. ইউনেস্কো সুন্দরবনকে ওয়ার্ল্ড হেরিটেজ ঘোষণা করে কত সালে?", a: ["১৯৯৭", "১৯৯৯", "১৯৯৫", "২০০০"], correct: 0 },
    { q: "৩০. 'লাইন অফ কন্ট্রোল' (LoC) কোন দুটি দেশের মধ্যকার সীমানা?", a: ["ভারত ও পাকিস্তান", "ভারত ও চীন", "পাকিস্তান ও আফগানিস্তান", "উত্তর ও দক্ষিণ কোরিয়া"], correct: 0 }
];

let currentQuestion = 0;
let rightCount = 0;
let wrongCount = 0;
let answered = false;
let totalTime = 8 * 60; // 8 minutes
let timerInterval;

function startTimer() {
    timerInterval = setInterval(() => {
        let minutes = Math.floor(totalTime / 60);
        let seconds = totalTime % 60;
        seconds = seconds < 10 ? '0' + seconds : seconds;
        minutes = minutes < 10 ? '0' + minutes : minutes;
        document.getElementById("time-display").innerText = `${minutes}:${seconds}`;

        if (totalTime <= 0) {
            clearInterval(timerInterval);
            finishQuiz();
        }
        totalTime--;
    }, 1000);
}

function loadQuestion() {
    answered = false;
    document.getElementById("next-btn").style.display = "none";
    const qData = quizData[currentQuestion];
    document.getElementById("question-text").innerText = qData.q;
    
    const optionsContainer = document.getElementById("options");
    optionsContainer.innerHTML = "";

    qData.a.forEach((optionText, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = optionText;
        btn.onclick = () => selectOption(btn, index);
        optionsContainer.appendChild(btn);
    });
}

function selectOption(selectedBtn, selectedIndex) {
    if (answered) return;
    answered = true;

    const qData = quizData[currentQuestion];
    const options = document.getElementById("options").children;

    if (selectedIndex === qData.correct) {
        selectedBtn.classList.add("correct");
        rightCount++;
        document.getElementById("right-count").innerText = rightCount;
    } else {
        selectedBtn.classList.add("wrong");
        options[qData.correct].classList.add("correct");
        wrongCount++;
        document.getElementById("wrong-count").innerText = wrongCount;
    }

    if (currentQuestion < quizData.length - 1) {
        document.getElementById("next-btn").style.display = "block";
    } else {
        setTimeout(finishQuiz, 1000);
    }
}

function nextQuestion() {
    if (currentQuestion < quizData.length - 1) {
        currentQuestion++;
        loadQuestion();
    }
}

function finishQuiz() {
    clearInterval(timerInterval);
    document.getElementById("quiz-header").style.display = "none";
    document.getElementById("quiz-body").style.display = "none";
    
    document.getElementById("total-answered").innerText = rightCount + wrongCount;
    document.getElementById("final-right").innerText = rightCount;
    document.getElementById("final-wrong").innerText = wrongCount;
    document.getElementById("result-body").style.display = "block";
}

// Start Quiz
loadQuestion();
startTimer();
</script>

</body>
</html>
